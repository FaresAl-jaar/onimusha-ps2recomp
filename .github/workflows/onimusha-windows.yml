name: Onimusha Windows build

on:
  push:
    branches: [build/stage1-speed-6bba51e]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onimusha-windows-stage1-speed
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build launcher
        shell: cmd
        run: |
          cmake -S launcher -B build-launcher -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-launcher --target OnimushaLauncher

      - name: Configure game
        shell: cmd
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=/O2 /Ob1 /DNDEBUG /arch:AVX2"
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=/O2 /Ob1 /DNDEBUG /arch:AVX2"
          -DPS2X_BUILD_RECOMP=OFF -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF
          -DPS2X_SHOW_WINDOWS_CONSOLE=OFF -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_NO_LTO=ON
          -DPS2X_ENABLE_RUNTIME_LOGS=OFF -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF -DPS2X_ENABLE_IOP_RPC_TRACE=OFF

      - name: Build game
        shell: cmd
        run: cmake --build build --target ps2EntryRunner --parallel 4

      - name: Package
        shell: pwsh
        run: |
          $out = "OnimushaPC"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/ps2xRuntime/ps2EntryRunner.exe "$out/Onimusha.exe"
          Get-ChildItem build/ps2xRuntime -Filter *.dll | Copy-Item -Destination $out
          Copy-Item build-launcher/OnimushaPC/OnimushaLauncher.exe $out
          Copy-Item onimusha/README.txt $out
          Compress-Archive -Path "$out/*" -DestinationPath OnimushaPC-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OnimushaPC-windows-x64
          path: OnimushaPC-windows-x64.zip
